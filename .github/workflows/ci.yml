name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - run: python -m pytest -q
      - name: MCP handshake smoke
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | python mcp_server.py | python -c "import sys,json; o=json.loads(sys.stdin.readline()); print(o['result']['serverInfo'])"